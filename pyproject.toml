[project]
name = "sentineledge"
version = "0.1.0"
description = "Home environment monitoring: MQTT telemetry ingestion into TimescaleDB behind a FastAPI API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
# Revision files are Alembic-generated scaffolding; reformatting them would only
# churn history. `migrations/env.py` is hand-written and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, flake8-simplify. `UP` is what
# keeps the modern spellings (X | None, list[T], StrEnum) from drifting back.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
